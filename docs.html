<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedarbridge | Project Documentation</title><style>body{margin:0;background:#f8f6fa;color:#2f2a35;font:15px/1.7 "Segoe UI",Aptos,Arial,sans-serif}*{box-sizing:border-box}a{color:#674783}header{background:white;border-bottom:1px solid #e9e2ec;padding:19px max(22px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;gap:20px}header a{text-decoration:none}main{max-width:1080px;margin:32px auto;padding:0 20px}.paper{background:white;border:1px solid #e9e2ec;border-radius:10px;padding:38px 48px;box-shadow:0 5px 25px #2715380c}h1{font-size:29px;line-height:1.3;color:#463051;letter-spacing:-.03em}h2{font-size:21px;color:#463051;border-top:1px solid #e9e2ec;padding-top:23px;margin-top:34px}h3{color:#563b66}p{margin:0 0 17px}li{margin:5px 0}code{background:#f2edf6;font:13px Consolas,monospace;padding:2px 5px;border-radius:3px}.tablewrap{overflow-x:auto;border:1px solid #e9e2ec;border-radius:7px;margin:18px 0 25px}table{border-collapse:collapse;width:100%;min-width:570px;font-size:13px;line-height:1.5}th,td{padding:11px 12px;border-bottom:1px solid #ece7ef;text-align:left;vertical-align:top}th{background:#f2edf5;color:#42344b}tr:nth-child(even){background:#fcfafc}blockquote{border-left:3px solid #9a79b0;background:#f7f4f9;padding:12px 18px}pre{background:#282532;color:#fff;padding:17px;overflow:auto;border-radius:7px}pre code{background:none;color:inherit}nav{display:flex;gap:17px}.back{color:#75677e;font-size:13px}#error{color:#ad3b46}@media(max-width:700px){header{padding:14px;flex-wrap:wrap}main{padding:0 9px;margin:12px auto}.paper{padding:25px 18px}h1{font-size:24px}}</style></head><body><header><a href="index.html"><strong>Cedarbridge</strong> / Documentation</a><nav><a href="index.html">Portfolio</a><a href="app.html">Prototype</a><a href="analytics.html">Dashboard</a></nav></header><main><p class="back">Independent fictional case study · Synthetic data only</p><article class="paper" id="content">Loading documentation…</article></main><script>const files=["SPRINT_1_REVIEW.md","MANUAL_QA_2026-11-13.md","REQUIREMENTS_TRACEABILITY.md","UAT_EXECUTION_MATRIX.md","UX_ITERATION.md","KPI_DEFINITIONS.md","POWER_BI_BUILD_GUIDE.md","NEXT_STEPS.md","FINAL_PORTFOLIO_SUMMARY.md","BA_REVIEW.md","INTERVIEW_PREP.md"];const query=new URLSearchParams(location.search).get("file");const file=files.includes(query)?query:"SPRINT_1_REVIEW.md";const e=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");const f=s=>e(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,l,u)=>{if(u.endsWith(".md")&&files.includes(u))u="docs.html?file="+encodeURIComponent(u);return /^https?:\/\/|^docs\.html\?file=/.test(u)?'<a href="'+e(u)+'">'+l+'</a>':l}).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");function render(md){const lines=md.split(/\r?\n/),out=[];let i=0;while(i<lines.length){const l=lines[i].trim();if(!l){i++;continue}let h=l.match(/^(#{1,4})\s+(.+)$/);if(h){out.push("<h"+h[1].length+">"+f(h[2])+"</h"+h[1].length+">");i++;continue}if(l.startsWith("```")){let b=[];i++;while(i<lines.length&&!lines[i].trim().startsWith("```"))b.push(lines[i++]);i++;out.push("<pre><code>"+e(b.join("\n"))+"</code></pre>");continue}if(l.startsWith("|")&&i+1<lines.length&&/^\s*\|?\s*:?-{3}/.test(lines[i+1])){const cell=t=>t.trim().replace(/^\||\|$/g,"").split("|"),head=cell(l);i+=2;let rows=[];while(i<lines.length&&lines[i].trim().startsWith("|"))rows.push(cell(lines[i++]));out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>"<th>"+f(c.trim())+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+head.map((c,j)=>"<td>"+f((r[j]||"").trim())+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");continue}if(/^\s*[-*]\s+/.test(l)){let b=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))b.push("<li>"+f(lines[i++].replace(/^\s*[-*]\s+/,""))+"</li>");out.push("<ul>"+b.join("")+"</ul>");continue}if(/^\d+\.\s+/.test(l)){let b=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))b.push("<li>"+f(lines[i++].replace(/^\s*\d+\.\s+/,""))+"</li>");out.push("<ol>"+b.join("")+"</ol>");continue}if(l.startsWith(">")){out.push("<blockquote>"+f(l.replace(/^>\s*/,""))+"</blockquote>");i++;continue}out.push("<p>"+f(l)+"</p>");i++}return out.join("\n")}fetch("./"+file).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.text()}).then(md=>{document.getElementById("content").innerHTML=render(md);document.title=(document.querySelector("h1")?.textContent||"Document")+" | Cedarbridge"}).catch(err=>document.getElementById("content").innerHTML='<p id="error">Unable to load document: '+e(err.message)+'</p>');</script></body></html>
